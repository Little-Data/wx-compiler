name: Build WeChat DevTools (ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'wx-compiler ref (branch/tag/sha)'
        required: false
        default: 'master'
      devtools_ref:
        description: 'wechat-web-devtools-linux ref (has arm64 config)'
        required: false
        default: 'electron'

env:
  COMPILER_REF: ${{ github.event.inputs.compiler_ref || 'master' }}
  DEVTOOLS_REF: ${{ github.event.inputs.devtools_ref || 'electron' }}
  BUILD_TYPE: Release

# 说明：
# 阶段1 在 x86_64 runner 上交叉编译 wx-compiler，产出 arm64 的 wcc/wcsc（及 .node 原生模块）。
# 阶段2 用 wechat-web-devtools-linux 自身脚本（x86→arm64 交叉编译 + QEMU 运行 arm64 运行时）
#       组装出 Electron 版微信开发者工具 arm64 包。
# 阶段3 仅 tag 触发时发布 Release。

jobs:
  # ─────────────────────────────────────────────
  # 阶段1：编译 wx-compiler (arm64)
  # ─────────────────────────────────────────────
  build-compiler:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout wx-compiler
        uses: actions/checkout@v4
        with:
          repository: little-Data/wx-compiler
          ref: ${{ env.COMPILER_REF }}
          path: wx-compiler
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make pkg-config \
            xz-utils wget file ca-certificates

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable pnpm & install compiler toolchain deps
        working-directory: wx-compiler
        run: |
          corepack enable
          # --no-frozen-lockfile：lockfile 可能未与当前 HEAD 同步
          pnpm install --no-frozen-lockfile
          pnpm exec cmake-js --version

      - name: Build wcc / wcsc / .node (ARM64)
        working-directory: wx-compiler
        run: |
          # 复用仓库自带交叉编译脚本（下载 ARM GNU 工具链并编译）
          bash tools/build-arm64.sh

      - name: Collect artifacts with canonical names
        working-directory: wx-compiler
        run: |
          set -e
          mkdir -p compiler-out
          # 产物命名对齐 wechat-web-devtools-linux/tools/fix-compiler.sh 期望的名字
          mv build/wcc              compiler-out/wcc-arm64
          mv build/wcsc             compiler-out/wcsc-arm64
          mv build/wcc_module.node  compiler-out/wcc-arm64.node
          mv build/wcsc_module.node compiler-out/wcsc-arm64.node
          chmod +x compiler-out/wcc-arm64 compiler-out/wcsc-arm64
          ls -lh compiler-out
          # 校验架构为 aarch64
          file compiler-out/wcc-arm64
          file compiler-out/wcc-arm64 | grep -q 'aarch64'

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: wx-compiler-arm64.build
          path: wx-compiler/compiler-out
          retention-days: 7

  # ─────────────────────────────────────────────
  # 阶段2：组装 wechat-dev-tools (arm64)
  # ─────────────────────────────────────────────
  build-devtools:
    needs: build-compiler
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ACTION_MODE: 'true'
      WINE: 'false'
      # 对应 build-with-docker.sh 里的环境，保证 node-gyp / asar 写入仓库内 cache
      npm_config_prefix: ${{ github.workspace }}/devtools/cache/npm/node_global
      npm_config_cache: ${{ github.workspace }}/devtools/cache/npm/node_cache
    steps:
      - name: Checkout wechat-web-devtools-linux
        uses: actions/checkout@v4
        with:
          repository: little-Data/wechat-web-devtools-linux
          ref: ${{ env.DEVTOOLS_REF }}
          path: devtools
          submodules: recursive

      - name: Set up Node.js (build host tooling)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # QEMU：让 x86_64 主机能运行 arm64 的 node/electron（打包阶段读版本、架构校验用）
      - name: Set up QEMU (run arm64 binaries)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install cross toolchain & build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            p7zip-full wget xz-utils file dpkg \
            python3 python-is-python3
          # rebuild-node-modules.sh 强制 `hash python2` 检测；node-gyp@11 实际使用 python3。
          # 提供 python2 符号链接即可通过检查（jammy 无独立 python2 包）。
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python2

      - name: Download compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: wx-compiler-arm64.build
          path: compiler-out

      - name: Inject wx-compiler into devtools build
        working-directory: devtools
        run: |
          set -e
          COMPILER_VERSION=$(node tools/parse-config.js --get-compiler-version)
          echo "COMPILER_VERSION=$COMPILER_VERSION"
          CACHE_DIR="cache/compiler/v${COMPILER_VERSION}"
          mkdir -p "$CACHE_DIR"
          cp ../compiler-out/wcc-arm64       "$CACHE_DIR/wcc-arm64"
          cp ../compiler-out/wcsc-arm64      "$CACHE_DIR/wcsc-arm64"
          cp ../compiler-out/wcc-arm64.node  "$CACHE_DIR/wcc-arm64.node"
          cp ../compiler-out/wcsc-arm64.node "$CACHE_DIR/wcsc-arm64.node"
          chmod +x "$CACHE_DIR/wcc-arm64" "$CACHE_DIR/wcsc-arm64"
          ls -lh "$CACHE_DIR"

      - name: Build devtools (download electron/node/devtools, cross rebuild native modules)
        working-directory: devtools
        run: |
          export PATH="$PWD/cache/npm/node_global/bin:$PATH"
          bash tools/setup-wechat-devtools.sh --arch arm64

      - name: Verify architecture (run arm64 node via QEMU)
        working-directory: devtools
        run: |
          set -e
          # 注入的编译器应为 aarch64
          file cache/compiler/v*/wcc-arm64 | grep -q 'aarch64'
          # 打包的运行时 node 也为 aarch64 且可执行
          "$PWD/electron/node" -p "process.arch + ' ' + process.version"
          "$PWD/electron/node" -p "process.arch" | grep -q 'arm64'

      - name: Package release tarball
        working-directory: devtools
        run: |
          set -e
          DEVTOOLS_VERSION=$("$PWD/electron/node" -p \
            "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version" \
            "$PWD/resources/app/package.json")
          echo "DEVTOOLS_VERSION=$DEVTOOLS_VERSION"
          bash tools/build-tar.sh "v${DEVTOOLS_VERSION}-continuous" arm64
          ls -lh tmp/build

      - name: Upload devtools artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-arm64.build
          path: devtools/tmp/build/*.tar.gz
          retention-days: 30

  # ─────────────────────────────────────────────
  # 阶段3：发布 Release（仅 tag 触发）
  # ─────────────────────────────────────────────
  release:
    needs: build-devtools
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download devtools artifact
        uses: actions/download-artifact@v4
        with:
          name: wechat-devtools-arm64.build
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
