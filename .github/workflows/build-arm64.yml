name: Build WeChat DevTools (ARM64)

# 触发：推 tag / 手动
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'wx-compiler ref (branch/tag/sha)'
        required: false
        default: 'master'
      devtools_ref:
        description: 'wechat-web-devtools-linux ref'
        required: false
        default: 'electron'
      nwjs_version:
        description: 'NW.js SDK version (must match devtools expectation)'
        required: false
        default: '0.87.0'

env:
  COMPILER_REF: ${{ github.event.inputs.compiler_ref || 'master' }}
  DEVTOOLS_REF: ${{ github.event.inputs.devtools_ref || 'electron' }}
  NWJS_VERSION: ${{ github.event.inputs.nwjs_version || '0.87.0' }}
  BUILD_TYPE: Release

jobs:
  # 阶段 1：在 x86_64  runner 上交叉编译出 ARM64 的 wcc / wcsc / .node
  build-compiler:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout wx-compiler
        uses: actions/checkout@v4
        with:
          repository: msojocs/wx-compiler
          ref: ${{ env.COMPILER_REF }}
          path: wx-compiler
          submodules: recursive

      - name: Install cross-toolchain & build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config wget unzip ca-certificates

      - name: Set up Node (for .node addon ABI headers)
        uses: actions/setup-node@v4
        with:
          node-version: '18'   # 需与 NW.js 内置 Node ABI 一致，见 docs/Version.MD

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install node-gyp globally
        run: npm install -g node-gyp

      - name: Configure (cross compile, aarch64)
        working-directory: wx-compiler
        run: |
          mkdir -p build-arm64
          cat > build-arm64/toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER   aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF
          cmake -S . -B build-arm64 \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=build-arm64/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNODE_ARCH=arm64 \
            -DNODE_ADDON_API=ON

      - name: Build wcc / wcsc / .node
        working-directory: wx-compiler
        run: cmake --build build-arm64 -j$(nproc)

      - name: Collect artifacts with canonical names
        working-directory: wx-compiler
        run: |
          mkdir -p /tmp/compiler-out
          # 以下文件名以仓库实际产物为准，按需调整
          cp build-arm64/wcc    /tmp/compiler-out/wcc-arm64      2>/dev/null || true
          cp build-arm64/wcsc   /tmp/compiler-out/wcsc-arm64     2>/dev/null || true
          cp build-arm64/*.node /tmp/compiler-out/               2>/dev/null || true
          ls -lh /tmp/compiler-out
          # 兜底：若 .node 未生成，继续但标记失败
          [ -s /tmp/compiler-out/wcc-arm64 ] && [ -s /tmp/compiler-out/wcsc-arm64 ] || exit 1

      - name: Upload compiler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wx-compiler-arm64
          path: /tmp/compiler-out
          retention-days: 7

  # 阶段 2：把 ARM64 二进制注入 devtools，并打包（QEMU 模拟 arm64 验证）
  package-devtools:
    needs: build-compiler
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout wechat-web-devtools-linux
        uses: actions/checkout@v4
        with:
          repository: msojocs/wechat-web-devtools-linux
          ref: ${{ env.DEVTOOLS_REF }}
          path: devtools
          submodules: recursive

      - name: Download compiler artifacts
        uses: actions/download-artifact@v4
        with:
          name: wx-compiler-arm64
          path: compiler-out

      - name: Set up QEMU for cross-arch test
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare arm64 rootfs + NW.js (linux-arm64)
        working-directory: devtools
        run: |
          ARCH=arm64
          NWJS_URL="https://dl.nwjs.io/v${NWJS_VERSION}/nwjs-sdk-v${NWJS_VERSION}-linux-${ARCH}.tar.gz"
          echo "Fetching NW.js: $NWJS_URL"
          wget -q "$NWJS_URL" -O nwjs.tar.gz || {
            echo "::error::NW.js arm64 包下载失败，请核对 NWJS_VERSION"; exit 1; }
          mkdir -p nwjs && tar -xzf nwjs.tar.gz -C nwjs --strip-components=1
          echo "nwjs ready:"; ls nwjs | head

      - name: Inject wcc / wcsc / .node into package.nw
        working-directory: devtools
        run: |
          set -e
          ls -lh ../compiler-out
          # wcc-exec 命令行二进制
          mkdir -p package.nw/node_modules/wcc-exec
          cp ../compiler-out/wcc-arm64  package.nw/node_modules/wcc-exec/wcc
          cp ../compiler-out/wcsc-arm64 package.nw/node_modules/wcc-exec/wcsc
          chmod +x package.nw/node_modules/wcc-exec/{wcc,wcsc}
          # native addon（文件名以实际为准，常见为 wcc_module.node / wcsc_module.node）
          mkdir -p package.nw/node_modules/wcc/build/Release
          cp ../compiler-out/*.node package.nw/node_modules/wcc/build/Release/ || true
          # 写回编译器版本锁定文件（路径/字段名以仓库实际为准）
          mkdir -p conf
          echo "WX_COMPILER_VERSION=${COMPILER_REF}" > conf/compiler_version 2>/dev/null || true
          echo "ARCH=arm64" >> conf/compiler_version 2>/dev/null || true

      - name: Run setup script (best-effort, may need NW.js GUI)
        working-directory: devtools
        run: |
          # 优先使用仓库自带 setup；不存在则跳过
          if [ -x ./tools/setup-wechat-devtools.sh ]; then
            ./tools/setup-wechat-devtools.sh || echo "setup 脚本返回非零（多为 GUI 相关），继续打包"
          elif [ -x ./tools/fix-other.sh ]; then
            ./tools/fix-other.sh || true
          fi
          # 重新编译原生模块以对齐 Node ABI（同 NW.js 内置版本）
          ( cd package.nw && npm rebuild --target_arch=arm64 --target_platform=linux ) || true

      - name: Smoke test under QEMU (emulated arm64)
        working-directory: devtools
        run: |
          # 用静态 binary 验证架构正确，避免 Exec format error
          file package.nw/node_modules/wcc-exec/wcc | tee /tmp/arch.txt
          grep -q "aarch64" /tmp/arch.txt || { echo "::error::产物不是 aarch64"; exit 1; }
          # 若环境允许，chroot 进 arm64 rootfs 实际运行 wcc --version（可选）
          # ./nwjs/nw --version  # GUI 环境通常不可用，仅记录

      - name: Pack final tarball
        working-directory: devtools
        run: |
          VERSION="${COMPILER_REF}-arm64"
          tar -czf "wechat-devtools-${VERSION}.tar.gz" package.nw nwjs conf 2>/dev/null || \
          tar -czf "wechat-devtools-${VERSION}.tar.gz" .
          ls -lh "wechat-devtools-${VERSION}.tar.gz"
          echo "ASSET=wechat-devtools-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Upload devtools artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-arm64
          path: devtools/wechat-devtools-*.tar.gz
          retention-days: 30

  # 阶段 3：打 Release（仅 tag 触发时）
  release:
    needs: package-devtools
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download devtools artifact
        uses: actions/download-artifact@v4
        with:
          name: wechat-devtools-arm64
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wechat-devtools-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
